name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with lean-action
        uses: leanprover/lean-action@v1
        with:
          auto-config: true
          lake-package-directory: .
