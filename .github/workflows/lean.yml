name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf |
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          cat lean-toolchain
          lean --version
          lake --version

      - name: Lake update (fetch Mathlib + write lake-manifest.json)
        run: lake update

      - name: Mathlib oleans cache
        run: lake exe cache get || echo "cache get skipped/partial; will compile from source"

      - name: Verify Mathlib AddCircle.Defs exists
        run: |
          test -f .lake/packages/mathlib/Mathlib/Topology/Instances/AddCircle/Defs.lean \
            && echo "AddCircle/Defs.lean OK" \
            || (echo "AddCircle/Defs.lean MISSING"; ls .lake/packages/mathlib/Mathlib/Topology/Instances/AddCircle/ | head -50; exit 1)

      - name: Build
        run: lake build

      - name: On failure hint
        if: failure()
        run: |
          echo "Copy from the first error: downward and send to Grok."
